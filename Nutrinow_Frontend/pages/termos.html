<html lang="pt-BR">

    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Termos de Uso - NutriNow</title>
    <meta name="description" content="Termos e condições de uso da plataforma NutriNow." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />

    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:2rem 1rem;max-width:48rem;margin:0 auto;">
            <h1>Termos de Uso</h1>
            <p class="text-muted">Última atualização: 03/06/2026</p>
            <div style="margin-top:2rem;">
              <section style="margin-bottom:1.5rem;">
                <h2>1. Aceitação</h2>
                <p>Ao criar conta ou usar o NutriNow, você concorda com estes termos e com a Política de Privacidade. Se não concordar, não utilize a plataforma.</p>
              </section>
              <section style="margin-bottom:1.5rem;">
                <h2>2. Natureza do serviço</h2>
                <p>O NutriNow é uma plataforma de organização de rotina saudável, dietas, treinos e conversas com IA. As respostas da NutriAI são informativas e não substituem avaliação de profissional habilitado.</p>
              </section>
              <section style="margin-bottom:1.5rem;">
                <h2>3. Conta e segurança</h2>
                <p>Você é responsável por manter suas credenciais seguras, fornecer dados verdadeiros e avisar caso perceba uso não autorizado da conta.</p>
              </section>
              <section style="margin-bottom:1.5rem;">
                <h2>4. Uso aceitável</h2>
                <p>É proibido usar a plataforma para atividades ilegais, tentar acessar dados de terceiros, explorar falhas ou gerar conteúdo que incentive práticas prejudiciais à saúde.</p>
              </section>
              <section style="margin-bottom:1.5rem;">
                <h2>5. Integrações</h2>
                <p>Google OAuth, Google Calendar, e-mail e provedores de IA dependem de serviços externos. Indisponibilidades podem afetar funcionalidades específicas.</p>
              </section>
              <section style="margin-bottom:1.5rem;">
                <h2>6. Disponibilidade e alterações</h2>
                <p>O serviço pode receber melhorias, correções e ajustes de segurança. Funcionalidades experimentais podem ser alteradas ou removidas.</p>
              </section>
              <section style="margin-bottom:1.5rem;">
                <h2>7. Contato</h2>
                <p>Dúvidas sobre estes termos devem ser enviadas pelo canal de suporte informado pelo controlador do projeto.</p>
              </section>
            </div>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
