<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Criar conta - NutriNow</title>
    <meta name="description" content="Crie sua conta NutriNow gratuita e comece a organizar sua nutrição e treinos com IA." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="apple-touch-icon" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:4rem 1rem;max-width:28rem;margin:0 auto;">
            <h1>Criar conta</h1>
            <p class="text-muted">Comece sua jornada com NutriNow gratuitamente.</p>
            <form id="cadastro-form" style="margin-top:2rem;">
              <div class="field">
                <label for="nome">Nome completo</label>
                <div class="input-wrap">
                  <input id="nome" class="input" type="text" name="nome" placeholder="Seu nome" autocomplete="name" required />
                </div>
              </div>
              <div class="field">
                <label for="email">E-mail</label>
                <div class="input-wrap">
                  <input id="email" class="input" type="email" name="email" placeholder="seu@email.com" autocomplete="email" required />
                </div>
              </div>
              <div class="field">
                <label for="senha">Senha</label>
                <div class="input-wrap">
                  <input id="senha" class="input" type="password" name="senha" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required />
                  <button type="button" class="icon-btn password-toggle" data-toggle-password="senha" aria-label="Mostrar senha" tabindex="-1">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7C3.7 7.68 7.38 5 12 5s8.3 2.68 9.94 6.65a1 1 0 0 1 0 .7C20.3 16.32 16.62 19 12 19s-8.3-2.68-9.94-6.65Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <div class="field">
                <label for="confirmar-senha">Confirmar senha</label>
                <div class="input-wrap">
                  <input id="confirmar-senha" class="input" type="password" name="confirmar-senha" placeholder="Repita a senha" autocomplete="new-password" minlength="8" required />
                </div>
              </div>
              <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem;">Criar conta</button>
            </form>
            <p style="margin-top:1rem;text-align:center;">
              Já tem conta? <a href="/login" data-link>Entrar</a>
            </p>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
</html>
