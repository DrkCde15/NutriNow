<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>NutriNow - Nutrição e treinos com IA</title>
    <meta name="description" content="NutriNow é seu assistente de nutrição e treinos com IA. Crie planos personalizados, analise refeições por foto e converse com a NutriAI." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="apple-touch-icon" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="preload" as="image" href="../assets/hero-nutrition.jpg" />
    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
    <style>
      .hero-media {
        width: min(100%, 30rem) !important;
        justify-self: center !important;
      }

      .hero-image {
        aspect-ratio: 1 / 1 !important;
        height: auto !important;
        max-height: 30rem !important;
      }

      .hero-image img {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:4rem 1rem;">
            <section style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;">
              <div>
                <h1 style="font-size:2.5rem;line-height:1.2;">Nutrição e treinos<br><span class="text-primary">com inteligência artificial</span></h1>
                <p class="text-muted" style="margin-top:1rem;font-size:1.125rem;">Planos personalizados, análise de refeições por foto e conversa com a NutriAI. Tudo em um só lugar.</p>
                <div style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap;">
                  <a href="/cadastro" data-link class="btn btn-primary">Começar grátis</a>
                  <a href="/chat" data-link class="btn btn-secondary">Conhecer NutriAI</a>
                </div>
              </div>
              <div class="hero-media">
                <picture class="hero-image">
                  <img src="../assets/hero-nutrition.jpg" alt="Nutrição e treinos com IA" width="480" height="480" decoding="async" />
                </picture>
              </div>
            </section>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
</html>
