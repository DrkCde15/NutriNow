    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:4rem 1rem;text-align:center;max-width:32rem;margin:0 auto;">
            <div style="font-size:3rem;margin-bottom:1rem;">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:3rem;height:3rem;color:var(--green);"><path d="m20 6-11 11-5-5"/></svg>
            </div>
            <h1>Pagamento aprovado!</h1>
            <p class="text-muted" style="margin-top:0.5rem;">Seu plano premium NutriNow está ativo. Aproveite todos os recursos exclusivos.</p>
            <div style="margin-top:2rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
              <a href="/dashboard" data-link class="btn btn-primary">Ir para Dashboard</a>
              <a href="/planos" data-link class="btn btn-secondary">Ver planos</a>
            </div>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
