<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Dashboard - NutriNow</title>
    <meta name="description" content="Acompanhe seu progresso, métricas e resumo da sua jornada no NutriNow." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="apple-touch-icon" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:2rem 1rem;">
            <h1>Dashboard</h1>
            <p class="text-muted">Acompanhe seu progresso de nutrição e treinos.</p>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;margin-top:2rem;">
              <div class="card"><h3>Refeições</h3><p class="text-muted">Resumo das suas refeições do dia.</p></div>
              <div class="card"><h3>Treinos</h3><p class="text-muted">Próximos treinos agendados.</p></div>
              <div class="card"><h3>Progresso</h3><p class="text-muted">Evolução de peso e medidas.</p></div>
              <div class="card"><h3>Metas</h3><p class="text-muted">Metas da semana.</p></div>
            </div>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
</html>
