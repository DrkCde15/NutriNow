<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Detalhe do Paciente - NutriNow</title>
    <meta name="description" content="Visualize e gerencie os detalhes de um paciente ou aluno." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="apple-touch-icon" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:2rem 1rem;">
            <a href="/pacientes" data-link class="btn btn-ghost" style="margin-bottom:1rem;">Voltar para pacientes</a>
            <div style="display:grid;grid-template-columns:1fr 2fr;gap:1.5rem;">
              <div class="card" style="padding:1.5rem;">
                <h2>Perfil do Paciente</h2>
                <p class="text-muted">Informações básicas do paciente.</p>
              </div>
              <div style="display:flex;flex-direction:column;gap:1rem;">
                <div class="card" style="padding:1.5rem;">
                  <h3>Plano Alimentar</h3>
                  <p class="text-muted">Dieta e refeições do paciente.</p>
                </div>
                <div class="card" style="padding:1.5rem;">
                  <h3>Plano de Treino</h3>
                  <p class="text-muted">Treinos e exercícios do paciente.</p>
                </div>
                <div class="card" style="padding:1.5rem;">
                  <h3>Anotações</h3>
                  <p class="text-muted">Anotações específicas deste paciente.</p>
                </div>
              </div>
            </div>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
</html>
