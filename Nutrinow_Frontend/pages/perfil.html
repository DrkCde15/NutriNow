<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Perfil - NutriNow</title>
    <meta name="description" content="Gerencie suas informações pessoais, preferências e configurações da conta NutriNow." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="apple-touch-icon" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:2rem 1rem;max-width:36rem;margin:0 auto;">
            <h1>Meu Perfil</h1>
            <p class="text-muted">Suas informações pessoais e configurações da conta.</p>
            <form id="perfil-form" style="margin-top:2rem;">
              <div class="field">
                <label for="nome">Nome completo</label>
                <div class="input-wrap">
                  <input id="nome" class="input" type="text" name="nome" autocomplete="name" required />
                </div>
              </div>
              <div class="field">
                <label for="email">E-mail</label>
                <div class="input-wrap">
                  <input id="email" class="input" type="email" name="email" autocomplete="email" required />
                </div>
              </div>
              <div class="field">
                <label for="altura">Altura (cm)</label>
                <div class="input-wrap">
                  <input id="altura" class="input" type="number" name="altura" placeholder="170" />
                </div>
              </div>
              <div class="field">
                <label for="peso">Peso (kg)</label>
                <div class="input-wrap">
                  <input id="peso" class="input" type="number" name="peso" placeholder="70" step="0.1" />
                </div>
              </div>
              <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Salvar alterações</button>
            </form>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
</html>
