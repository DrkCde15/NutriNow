<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Esqueci minha senha - NutriNow</title>
    <meta name="description" content="Recupere o acesso à sua conta NutriNow redefinindo sua senha." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="apple-touch-icon" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:4rem 1rem;max-width:28rem;margin:0 auto;">
            <h1>Esqueci minha senha</h1>
            <p class="text-muted">Digite seu e-mail para receber um link de redefinição de senha.</p>
            <form id="esqueci-senha-form" style="margin-top:2rem;">
              <div class="field">
                <label for="email">E-mail</label>
                <div class="input-wrap">
                  <input id="email" class="input" type="email" name="email" placeholder="seu@email.com" autocomplete="email" required />
                </div>
              </div>
              <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1rem;">Enviar link</button>
            </form>
            <p style="margin-top:1rem;text-align:center;">
              <a href="/login" data-link>Voltar para o login</a>
            </p>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
</html>
