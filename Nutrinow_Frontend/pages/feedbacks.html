<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Feedbacks - NutriNow</title>
    <meta name="description" content="Envie seu feedback ou sugestão para ajudar a melhorar o NutriNow." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="apple-touch-icon" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:2rem 1rem;max-width:36rem;margin:0 auto;">
            <h1>Feedbacks</h1>
            <p class="text-muted">Compartilhe sua opinião para melhorarmos o NutriNow.</p>
            <form id="feedback-form" style="margin-top:2rem;">
              <div class="field">
                <label for="tipo">Tipo</label>
                <div class="input-wrap">
                  <select id="tipo" class="input" name="tipo">
                    <option value="sugestao">Sugestão</option>
                    <option value="bug">Reportar bug</option>
                    <option value="elogio">Elogio</option>
                    <option value="outro">Outro</option>
                  </select>
                </div>
              </div>
              <div class="field">
                <label for="mensagem">Mensagem</label>
                <div class="input-wrap">
                  <textarea id="mensagem" class="input" name="mensagem" rows="5" placeholder="Descreva seu feedback..." required></textarea>
                </div>
              </div>
              <button type="submit" class="btn btn-primary">Enviar feedback</button>
            </form>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
</html>
