<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <title>Pacientes - NutriNow</title>
    <meta name="description" content="Gerencie seus pacientes e alunos no NutriNow Profissional." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/png" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="apple-touch-icon" href="../assets/logo.png?v=20260521-tab-logo" />
    <link rel="stylesheet" href="../styles.css?v=20260605-index-route" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (location.protocol.startsWith("http") && location.hash.startsWith("#/")) {
        history.replaceState({}, "", (location.pathname || "/") + location.search);
      }
    </script>
    <script type="module">
      import { headerMarkup, footerMarkup, pageShell } from '../js/shared/ui.js';
      import { migratePersistentSession, getUser } from '../js/shared/api.js';
      import { normalizePath, getCurrentPath } from '../js/shared/utils.js';

      migratePersistentSession();

      function renderPage() {
        const app = document.getElementById('app');
        const path = normalizePath(getCurrentPath());
        app.innerHTML = pageShell(`
          <main class="container" style="padding:2rem 1rem;">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
              <div>
                <h1>Pacientes</h1>
                <p class="text-muted">Gerencie seus pacientes e alunos.</p>
              </div>
              <button class="btn btn-primary">Adicionar paciente</button>
            </div>
            <div style="margin-top:2rem;">
              <div class="card" style="padding:2rem;text-align:center;">
                <p class="text-muted">Lista de pacientes será carregada aqui.</p>
              </div>
            </div>
          </main>
        `, path);
      }

      renderPage();
    </script>
  </body>
</html>
